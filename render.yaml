# Render Blueprint — Warehouse API + web + platform
# Docs: docs/deployment.md (Render section)
# Apply: Render Dashboard → New → Blueprint → this repo (branch main)

databases:
  - name: warehouse-db
    databaseName: warehouse
    user: warehouse
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only (API on Render)

services:
  - type: keyvalue
    name: warehouse-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private network only

  - type: web
    name: warehouse-api
    runtime: docker
    # Free tier: no preDeployCommand. After first deploy, run migrations once
    # from the service Shell: dotnet Warehouse.Api.dll --migrate-only
    # Upgrade to 0.5c-512mb+ for always-on and optional pre-deploy migrate.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Database__ConnectionString
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: WAREHOUSE_DB_CONNECTION
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: Redis__ConnectionString
        fromService:
          type: keyvalue
          name: warehouse-redis
          property: connectionString
      - key: JWT_SIGNING_KEY
        sync: false
      # Session lifetimes (optional; omit to use appsettings defaults: 180 min / 3h Scan & Go)
      # - key: JWT_ACCESS_TOKEN_MINUTES
      #   value: "180"
      # - key: SELF_CHECKOUT_SESSION_HOURS
      #   value: "3"
      # Platform admin (works even if seed restore fails). Same as local Development defaults.
      - key: Platform__BootstrapEmail
        value: platform@warehouse.local
      - key: Platform__BootstrapPassword
        value: Platform-Pass-123!
      - key: Platform__BootstrapDisplayName
        value: Platform Admin
      # Seed SQL in image; force one overwrite of empty/partial DBs after failed restores.
      # After tenant data appears, set this to "false" (or remove) so cold starts do not wipe data.
      - key: WAREHOUSE_RESTORE_DUMP_PATH
        value: /app/seed/warehouse.sql
      - key: WAREHOUSE_RESTORE_ON_START
        value: "true"
      - key: WAREHOUSE_MIGRATE_ON_START
        value: "true"
      # Set after Static Sites exist (https://warehouse-web-….onrender.com, etc.)
      - key: Cors__Origins__0
        sync: false
      - key: Cors__Origins__1
        sync: false

  - type: web
    name: warehouse-web
    runtime: static
    rootDir: clients/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: warehouse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: warehouse-platform
    runtime: static
    rootDir: clients/platform
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: warehouse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
